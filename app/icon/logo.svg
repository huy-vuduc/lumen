  <g transform="translate(-19 19)">
    <rect x="344" y="176" width="96" height="400" rx="48" fill="#2F6BF0"/>
    <polygon points="344,480 440,480 440,584 600,584 600,680 440,680 344,584" fill="#2F6BF0"/>
    <rect x="540" y="584" width="308" height="96" rx="48" fill="#2F6BF0"/>
    <rect x="-210" y="-42" width="420" height="84" rx="42" fill="#2B3542" transform="translate(392 632) rotate(45)"/>
  </g>
</svg>
