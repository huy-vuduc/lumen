# Publishes the lumen/ folder to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # index.html is written for the Claude artifact wrapper, which adds the
      # document skeleton; a doctype is enough for browsers to do the same.
      # LUMEN_PLAYTEST marks this site as the playtest build: it shows the
      # "open every chapter" switch that the app build does not have.
      - name: Build static site
        run: |
          mkdir dist
          cp -R lumen/. dist/
          { echo '<!doctype html>'; echo '<html lang="en">'; echo '<script>window.LUMEN_PLAYTEST = true</script>'; cat lumen/index.html; echo '</html>'; } > dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
